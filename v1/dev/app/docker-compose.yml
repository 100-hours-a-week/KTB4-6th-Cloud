x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  web_net:
    driver: bridge
  internal_net:
    driver: bridge

services:
  nginx:
    container_name: dev-nginx
    image: nginx:1.29.1-alpine
    restart: unless-stopped
    # 한 컨테이너가 메모리를 과하게 쓰면 넘친 컨테이너만 종료되게 상한을 둔다 (t3.small, 약 1.9GB).
    # 상한은 미리 확보하는 값이 아니므로 합이 서버 메모리보다 커도 된다. 실측 사용량은 약 9MB
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/logs:/var/log/nginx
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/acme-challenge:/var/www/certbot:ro # Certbot webroot 검증 파일 제공
      - /etc/letsencrypt:/etc/letsencrypt:ro         # 인증서와 심볼릭 링크 대상
      - /etc/nginx/ssl:/etc/nginx/ssl:ro             # 기존 설정이 이 경로를 사용할 때만 유지
    networks:
      - web_net
      - internal_net
    # depends_on은 이번 테스트에서만 무시 (--no-deps), 파일 자체는 수정하지 않음

  frontend:
    container_name: dev-fe
    # NEXT_PUBLIC_* 설정은 FE 이미지 빌드 시 GitHub Actions에서 주입한다.
    image: "devkyulim/meety-fe:${FE_IMAGE_TAG}"
    pull_policy: always
    restart: unless-stopped
    # 실측 사용량은 약 75MB. 서버 렌더링 중 순간 증가를 고려해 여유
    mem_limit: 384m
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      API_BASE_URL: "${API_BASE_URL}"
      AUTH_COOKIE_DOMAIN: "${AUTH_COOKIE_DOMAIN}"
      BUG_REPORT_DISCORD_WEBHOOK_URL: "${BUG_REPORT_DISCORD_WEBHOOK_URL}"
      TZ: Asia/Seoul
    networks:
      - web_net
    healthcheck:
      # /health가 200만 반환하면 되는 단순 엔드포인트이므로 wget --spider로 충분
      # --spider는 응답 바디를 저장하지 않고 상태 코드만 확인 (200 외엔 non-zero exit → unhealthy)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s   # Next.js 로그상 "Ready in 0ms"로 기동이 매우 빠르므로, backend의 40s보다 짧게 잡아도 충분
    logging: *default-logging

  backend:
    container_name: dev-be
    image: "devkyulim/meety-be:${BE_IMAGE_TAG}"
    pull_policy: always
    restart: unless-stopped
    # 힙(-Xmx1024m)에 힙 밖 메모리(메타스페이스, 스레드, Sentry 에이전트 등) 여유를 더한 값. 실측 사용량은 약 920MB.
    # JAVA_TOOL_OPTIONS의 -Xmx를 늘리면 이 값도 함께 늘린다. 낮게 잡으면 BE가 반복 종료된다
    mem_limit: 1400m
    # ProxySQL이 먼저 떠 있어야 DB에 접속할 수 있다
    depends_on:
      - proxysql
    ports:
      # AI 서버가 app 사설 IP:8080으로 호출하며, 접근은 보안 그룹에서 제한한다.
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      # 스테이징 정책은 배포 설정으로 고정하여 Parameter Store 대상에서 제외한다.
      MEETING_DAILY_CREATE_LIMIT: "100"
      CREDIT_MAX_BALANCE: "1000"                  # 팀 크레딧 잔액 상한
      CREDIT_TEAM_CREATE_GRANT: "200"             # 팀 생성 시 최초 지급량
      CREDIT_WEEKLY_GRANT: "200"                  # 주간 정기 지급량
      CREDIT_WEEKLY_GRANT_CRON: "0 0 0 * * MON"   # 매주 월요일 00:00(KST)에 지급
      CREDIT_RECORDING_COST: "0"                  # 녹음 시작 시 차감량
      CREDIT_SUMMARY_REGENERATE_COST: "0"         # 요약 재생성 시 차감량
      CREDIT_AI_CHAT_MESSAGE_COST: "0"            # AI 채팅 메시지 1회 비용 정책값(현재 차감 로직 미연결)
      CREDIT_ANALYSIS_REPORT_COST: "0"            # 분석 리포트 1회 비용 정책값(현재 차감 로직 미연결)
      SERVER_PORT: "8080"
      # staging 프로필의 ddl-auto 기본값(create)은 기동할 때마다 테이블을 지우고 다시 만든다.
      # dev 데이터를 유지하기 위해 update로 덮어쓴다 (BE에서 프로필 기본값을 고치면 제거)
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      # DB는 ProxySQL(같은 서버의 dev-proxysql)을 거쳐 dev-data(DATA_TIER_HOST)에 접속한다.
      # DB 이전 때 BE 재시작 없이 접속 대상을 바꾸기 위해서다. 직접 접속으로 되돌리려면 ${DATA_TIER_HOST}:3306으로 바꾼다
      SPRING_DATASOURCE_URL: "jdbc:mysql://dev-proxysql:6033/${DB_NAME}"
      SPRING_DATASOURCE_USERNAME: "${DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD}"
      # Redis
      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      KAKAO_CLIENT_ID: "${KAKAO_CLIENT_ID}"
      KAKAO_CLIENT_SECRET: "${KAKAO_CLIENT_SECRET}"
      KAKAO_REDIRECT_URI: "${KAKAO_REDIRECT_URI}"
      KAKAO_ADMIN_KEY: "${KAKAO_ADMIN_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xmx1024m -Xms512m}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      AI_WEBSOCKET_URL: "${AI_WEBSOCKET_URL}"
      AI_HTTP_URL: "${AI_HTTP_URL}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_S3_REGION: "${AWS_S3_REGION}"
      TZ: Asia/Seoul
      SENTRY_DSN:  "${SENTRY_DSN}"
      SENTRY_ENVIRONMENT: "staging"
      BE_SENTRY_LOGS_ENABLED: "true"
      SENTRY_PROFILE_SESSION_SAMPLE_RATE: "1.0"
      SENTRY_PROFILE_LIFECYCLE: "TRACE"
      SENTRY_SEND_DEFAULT_PII: "true"

      SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "-1"   # DB 다운 상태에서도 앱 기동은 성공하도록
      # 서울 DB 전환 뒤 요청당 DB 왕복(약 166ms × 7회)으로 연결 10개가 고갈돼 30개로 늘린다.
      # ProxySQL 서버당 상한(settings.json PROXYSQL_MAX_CONNECTIONS 40)과 MySQL max_connections 64 안에 둔다
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "30"
      SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.MySQLDialect"  # 부팅시 DB 프로브 커넥션 생략
      BE_SENTRY_TRACES_SAMPLE_RATE: "1.0"
      OTEL_LOGS_EXPORTER: "none"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_TRACES_EXPORTER: "none"
      # 토큰
      AUTH_ACCESS_TOKEN_COOKIE_NAME: "dev_accessToken"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 15s      # 15초마다 체크
      timeout: 5s        # 5초 내 응답 없으면 실패로 간주
      retries: 3         # 3번 연속 실패해야 unhealthy로 판정
      start_period: 40s  # 컨테이너 시작 후 40초는 유예기간 (Spring Boot 부팅 시간 감안, unhealthy로 안 잡음)
    networks:
      - web_net
      - internal_net
    # CloudWatch Agent가 수집하는 Docker json-file 로그를 유지한다.
    logging: *default-logging

  proxysql:
    container_name: dev-proxysql
    # 3.0.x는 Stable 계열. 3.0에서는 caching_sha2_password의 프론트엔드 RSA 인증을 지원하지 않아
    # BE → ProxySQL은 기본(mysql_native_password), ProxySQL → MySQL은 caching_sha2_password + TLS로 접속한다
    image: proxysql/proxysql:3.0.11
    restart: unless-stopped
    mem_limit: 256m                 # 실측 전이라 넉넉히. 측정 후 조정
    ports:
      - "127.0.0.1:6032:6032"      # 관리 포트: 서버 안에서만 접속
    expose:
      - "6033"                     # BE가 접속하는 포트 (내부 네트워크)
    volumes:
      - ./proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
      - ./proxysql/data:/var/lib/proxysql   # 런타임에 바꾼 설정(SAVE TO DISK) 유지
    networks:
      - internal_net
    logging: *default-logging
