x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    container_name: dev-db
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    command:
      - --innodb-buffer-pool-size=48M     # 기본 128M → 축소. 데이터가 아직 작아 체감 성능 차이 거의 없음
      - --performance-schema=OFF          # 진단용 내부 테이블, 기본 활성화 시 수십MB 소모. 지금 단계에선 불필요
      - --max-connections=20              # 기본 151 → 실제 동시 접속자 적으니 스레드/버퍼 오버헤드 축소
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USER}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      TZ: Asia/Seoul
      LANG: C.UTF-8
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    container_name: dev-redis
    image: redis:7.4
    restart: unless-stopped
    ports:
      # app 서버는 dev-data의 6376 포트로 접속한다.
      - "6376:6379"
    command:
      # 컨테이너 재시작 후에도 데이터를 복구할 수 있도록 AOF를 활성화한다.
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

volumes:
  db_data:
  redis_data:
