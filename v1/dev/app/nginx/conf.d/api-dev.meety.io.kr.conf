# BE 연결을 열어 두고 재사용한다. 요청마다 새 연결을 맺지 않아 FD와 연결 시간을 줄인다
upstream backend_api {
    server backend:8080;
    keepalive 32;
}

# WebSocket 요청에만 Connection: upgrade를 보낸다. 일반 요청은 비워 두어야 연결 재사용이 된다
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# 악성·과도한 요청 제한. 로그인한 요청은 인증 쿠키로, 로그인 전 요청은 IP로 구분한다.
# 쿠키 이름은 BE 이미지마다 다르다 (V1 accessToken, V2 dev_accessToken)
map "$cookie_dev_accessToken$cookie_accessToken" $limit_key {
    ""      $binary_remote_addr;
    default "$cookie_dev_accessToken$cookie_accessToken";
}
# 값은 실측 전이라 정상 사용이 닿지 않을 만큼 넉넉하게 두고, 부하 측정 후 조정한다
limit_req_zone  $limit_key          zone=api_user:5m rate=30r/s;
limit_conn_zone $limit_key          zone=api_user_conn:5m;
# 비밀번호 대입을 막는다. 테스트 스크립트가 시작할 때 계정을 한꺼번에 만드는 것은 순간 허용량으로 받는다
limit_req_zone  $binary_remote_addr zone=api_auth:5m rate=60r/m;

server {
    listen 443 ssl;
    server_name api-dev.meety.io.kr;

    access_log /var/log/nginx/sli_access.log meety_sli;

    include /etc/nginx/conf.d/ssl-params.conf;
    http2 off;

    ssl_certificate     /etc/letsencrypt/live/meety-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meety-dev/privkey.pem;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    # 사용자(또는 IP)별 제한. location에서 따로 정하지 않으면 모든 경로에 적용된다
    limit_req  zone=api_user burst=60 nodelay;
    limit_conn api_user_conn 100;
    limit_req_status  429;
    limit_conn_status 429;

    # location 안에서 proxy_set_header를 쓰면 바깥 설정을 물려받지 않으므로 경로마다 헤더를 모두 적는다

    # 녹음 오디오 WebSocket: 회의 동안 연결을 유지한다
    location /ws/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 회의·알림 SSE: 이벤트를 모으지 않고 바로 보낸다. BE 회의 SSE 제한(95분)보다 길게 유지한다
    location ~ ^/api/v1/(meetings/[0-9]+|notifications)/events$ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 6000s;
        proxy_send_timeout 60s;
    }

    # 로그인·회원가입: IP당 분당 60건, 순간 100건까지. 일반 API 제한 대신 이 제한만 적용한다
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=100 nodelay;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 일반 API: 멈춘 요청은 60초 뒤 놓는다 (마이그레이션 테스트의 실패 판정 45초보다 길게)
    location / {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
