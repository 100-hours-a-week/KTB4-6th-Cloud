<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#ffffff" />
    <title>서비스 점검 중 | Meety</title>
    <!-- 기존 FE와 같은 버전의 서체를 사용하며, 로드 실패 시 시스템 한글 서체로 표시한다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/assets/maintenance.css" />
  </head>
  <body>
    <!-- FE MaintenanceScreen의 문구·색상·390px 프레임을 정적 페이지로 옮긴다. -->
    <main class="frame" aria-labelledby="maintenance-title">
      <div class="notice" role="alert">
        <img class="mascot" src="/assets/meety-maintenance.png" alt="" width="160" height="160" />
        <span class="badge">서비스 점검 중</span>
        <h1 id="maintenance-title">더 안정적인 Meety를 위해<br />잠시 점검하고 있어요</h1>
        <p class="period">10월 25일 (일) 14:00 ~ 17:00</p>
        <p class="description">점검이 끝나면 다시 이용할 수 있어요.<br />이용에 불편을 드려 죄송합니다.</p>
      </div>
      <!-- 점검 규칙 해제 후 원래 서비스로 돌아갈 수 있도록 고정된 주소만 제공한다. -->
      <a class="return-link" href="https://meety.io.kr/">서비스로 돌아가기</a>
    </main>
  </body>
</html>
