server {
    listen 443 ssl;
    server_name api-dev.meety.io.kr;

    access_log /var/log/nginx/sli_access.log meety_sli;

    include /etc/nginx/conf.d/ssl-params.conf;
    http2 off;

    ssl_certificate     /etc/letsencrypt/live/meety-dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meety-dev/privkey.pem;

    location / {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}