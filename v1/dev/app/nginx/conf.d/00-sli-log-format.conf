# API 요청과 WebSocket 연결 결과를 한 줄의 JSON으로 기록한다.
# upstream_connect_time: BE 연결까지, upstream_header_time: BE 첫 응답까지 (부하 테스트 지연 위치 구분용)
log_format meety_sli escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":"$status",'
    '"request_time_s":"$request_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time_s":"$upstream_connect_time",'
    '"upstream_header_time_s":"$upstream_header_time",'
    '"upstream_response_time_s":"$upstream_response_time",'
    '"upgrade":"$http_upgrade"}';
