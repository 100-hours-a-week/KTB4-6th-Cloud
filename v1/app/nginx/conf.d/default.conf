server {
    listen 80;
    server_name meety.io.kr api.meety.io.kr analysis.meety.io.kr live.meety.io.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name meety.io.kr;

    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_certificate     /etc/nginx/ssl/meety.io.kr/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/meety.io.kr/private.key;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
